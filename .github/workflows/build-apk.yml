name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # GitHub runner ubuntu đã cài sẵn Android SDK (platforms, build-tools),
      # chỉ cần chấp nhận license rồi build.
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Giải mã keystore dùng chung debug + release từ secret
      - name: Decode Keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > bongdaplus-release.p12
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build Release APK (keystore chung, minify=true)
        run: gradle assembleRelease --stacktrace
        working-directory: ${{ github.workspace }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BongDaPlus-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      # Tạo GitHub Release mỗi lần chạy (bỏ qua PR), đính kèm APK release
      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: BongDaPlus v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/app-release.apk

      # 🧹 Xoá release cũ (giữ lại 1 bản)
      - name: Delete old releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 1
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🧹 Xoá workflow run cũ
      - name: Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 0
